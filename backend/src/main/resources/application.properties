
spring.datasource.url=jdbc:postgresql://postgres:5432/carbon
spring.datasource.username=carbon
spring.datasource.password=carbon

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=your_super_secret_key_change_in_production_very_long_key_here_at_least_32_chars
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# Server
server.port=8080
